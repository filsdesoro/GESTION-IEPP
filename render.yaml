services:
  - type: web
    name: gestion-iepp-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DB_SCHEMA
        value: public
      - key: CORS_ORIGINS
        value: "*"
